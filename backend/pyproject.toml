[project]
name = "pm-mvp-backend"
version = "0.1.0"
description = "FastAPI backend for the PM MVP app"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "python-dotenv>=1.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
